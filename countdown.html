<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Class X Exam Countdown</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b1220; color: #e8eefc; display: grid; place-items: center; min-height: 100vh;
    }
    .card {
      width: min(560px, 92vw);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 6px; font-size: 20px; font-weight: 700; letter-spacing: 0.2px; }
    .sub { margin: 0 0 16px; opacity: 0.85; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }
    .num { font-size: 28px; font-weight: 800; line-height: 1; }
    .lbl { margin-top: 6px; font-size: 12px; opacity: 0.8; }
    .footer {
      margin-top: 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      font-size: 12px; opacity: 0.85;
    }
    .pill {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 10px; border-radius: 999px;
    }
    .done { margin-top: 14px; padding: 12px; border-radius: 14px; display: none; }
    .done.show { display: block; background: rgba(34,197,94,0.18); border: 1px solid rgba(34,197,94,0.45); }
    a { color: #a8c7ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Class X Exam Countdown</h1>

    <div class="grid" aria-label="Countdown">
      <div class="box"><div class="num" id="d">--</div><div class="lbl">Days</div></div>
      <div class="box"><div class="num" id="h">--</div><div class="lbl">Hours</div></div>
      <div class="box"><div class="num" id="m">--</div><div class="lbl">Minutes</div></div>
      <div class="box"><div class="num" id="s">--</div><div class="lbl">Seconds</div></div>
    </div>

    <div class="done" id="done">✅ It’s exam time — all the best!</div>

    <div class="footer">
      <div class="pill" id="targetText">Target: --</div>
      <div class="pill">Timezone: Asia/Kolkata (IST)</div>
    </div>
  </div>

  <script>
    // ✅ EDIT THIS (IST):
    // Format: "YYYY-MM-DDTHH:MM:SS+05:30"
    // Example: "2026-02-15T10:30:00+05:30"
    const TARGET_IST = "2026-02-15T10:30:00+05:30";

    const elD = document.getElementById("d");
    const elH = document.getElementById("h");
    const elM = document.getElementById("m");
    const elS = document.getElementById("s");
    const done = document.getElementById("done");
    const targetText = document.getElementById("targetText");

    const target = new Date(TARGET_IST);
    targetText.textContent = "Target: " + target.toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }) + " IST";

    function pad(n) { return String(n).padStart(2, "0"); }

    function tick() {
      const now = new Date();
      let diff = target.getTime() - now.getTime();

      if (diff <= 0) {
        elD.textContent = "00";
        elH.textContent = "00";
        elM.textContent = "00";
        elS.textContent = "00";
        done.classList.add("show");
        return;
      }

      done.classList.remove("show");

      const sec = Math.floor(diff / 1000);
      const days = Math.floor(sec / 86400);
      const hours = Math.floor((sec % 86400) / 3600);
      const mins = Math.floor((sec % 3600) / 60);
      const secs = sec % 60;

      elD.textContent = pad(days);
      elH.textContent = pad(hours);
      elM.textContent = pad(mins);
      elS.textContent = pad(secs);

      requestAnimationFrame(() => {
        // Keep it smooth-ish but not battery-hungry:
        // update roughly every 250ms
      });
    }

    tick();
    setInterval(tick, 250);
  </script>
</body>
</html>
